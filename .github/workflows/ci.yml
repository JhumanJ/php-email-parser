name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [latest]
        include:
          - php: '8.2'
            dependencies: legacy-mime
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, iconv
          coverage: none
          tools: composer:v2
      - name: Select legacy MIME dependency
        if: matrix.dependencies == 'legacy-mime'
        run: composer require 'zbateson/mail-mime-parser:^2.4' 'symfony/mime:^6.4' --no-update --no-interaction
      - run: composer validate --strict
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer check
      - run: composer audit
      - name: Verify original fixtures are reproducible
        run: |
          python3 tests/Support/generate-fixtures.py
          git diff --exit-code -- tests/Fixtures
